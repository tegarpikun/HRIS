<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRIS GLOBAL - Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .nav-btn:hover { background-color: #f1f5f9; }
    </style>
</head>
<body class="bg-slate-50">

    <div id="main-content"></div>

    <script>
        // 1. KONFIGURASI
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz_c6lMPZJhZIJpiKEeJuUJKN4SQb9Gz--XUPaqjzzINuY2VczYJ3sTb_uIrlVtXENd/exec";
        let currentUser = JSON.parse(localStorage.getItem('hris_user')) || null;

        // 2. SISTEM PELUNCUR
        window.addEventListener('DOMContentLoaded', () => {
            if (currentUser) { 
                renderMainUI(); 
                showDashboard(); 
            } else { 
                renderLogin(); 
            }
        });

        function renderMainUI() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
            <div class="flex h-screen bg-slate-50 overflow-hidden">
                <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shadow-sm">
                    <div class="p-6 border-b border-slate-100 font-bold text-indigo-600 text-xl tracking-tight">HRIS GLOBAL</div>
                    <nav class="flex-1 p-4 space-y-1 overflow-y-auto text-sm">
                        <button onclick="showDashboard()" class="nav-btn w-full flex items-center gap-3 p-3 rounded-xl transition-all"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard</button>
                        <button onclick="showAbsensi()" class="nav-btn w-full flex items-center gap-3 p-3 rounded-xl transition-all"><i data-lucide="map-pin" class="w-4 h-4"></i> Presensi GPS</button>
                        <button onclick="showDailyTask()" class="nav-btn w-full flex items-center gap-3 p-3 rounded-xl transition-all"><i data-lucide="clipboard-check" class="w-4 h-4"></i> Daily Task</button>
                        <button onclick="showPayroll()" class="nav-btn w-full flex items-center gap-3 p-3 rounded-xl transition-all"><i data-lucide="banknote" class="w-4 h-4"></i> Payroll PPh21</button>
                    </nav>
                    <div class="p-4 border-t border-slate-100">
                        <button onclick="handleLogout()" class="w-full p-3 text-red-500 flex items-center gap-3 font-medium hover:bg-red-50 rounded-xl transition-all">
                            <i data-lucide="log-out" class="w-4 h-4"></i> Keluar Sistem
                        </button>
                    </div>
                </aside>
                <main id="content-area" class="flex-1 p-8 overflow-y-auto bg-slate-50"></main>
            </div>`;
            lucide.createIcons();
        }

        function showDashboard() {
            document.getElementById('content-area').innerHTML = `
            <div class="animate-in fade-in duration-500">
                <h2 class="text-2xl font-bold text-slate-800">Selamat Datang, ${currentUser.username}!</h2>
                <p class="text-slate-500">Aplikasi HRIS Global siap digunakan.</p>
            </div>`;
        }

        // Contoh fungsi login sederhana jika data kosong
        function renderLogin() {
            document.getElementById('main-content').innerHTML = `
            <div class="h-screen flex items-center justify-center bg-slate-100">
                <div class="bg-white p-8 rounded-3xl shadow-xl w-96 text-center">
                    <h2 class="text-2xl font-bold mb-6">Login HRIS</h2>
                    <input type="text" id="user-in" placeholder="Username" class="w-full p-3 mb-4 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="processLogin()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700">Masuk</button>
                </div>
            </div>`;
        }

        function processLogin() {
            const user = document.getElementById('user-in').value;
            if(user) {
                localStorage.setItem('hris_user', JSON.stringify({username: user}));
                location.reload();
            }
        }

        function handleLogout() {
            localStorage.removeItem('hris_user');
            location.reload();
        }

        // Tambahkan fungsi showAbsensi, showDailyTask, showPayroll sesuai kode GS Anda sebelumnya...
        function showDailyTask() {
            const area = document.getElementById('content-area');
            area.innerHTML = `
            <div class="max-w-2xl bg-white p-8 rounded-3xl border border-slate-200 shadow-sm animate-in slide-in-from-bottom-4">
                <h2 class="text-xl font-bold mb-6">Laporan Kerja Harian</h2>
                <form onsubmit="saveTask(event)" class="space-y-4">
                    <input type="text" id="t-name" placeholder="Nama Tugas" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500" required>
                    <textarea id="t-detail" placeholder="Detail pekerjaan harian..." class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500" rows="4" required></textarea>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-100">Kirim Tugas</button>
                </form>
            </div>`;
        }
    </script>
</body>
</html>
