<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRIS Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { jakarta: ['Plus Jakarta Sans', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    html, body { height: 100%; margin: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .sidebar-item { transition: all 0.2s; }
    .sidebar-item:hover, .sidebar-item.active { background: rgba(255,255,255,0.1); }
    .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .stat-gradient-1 { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
    .stat-gradient-2 { background: linear-gradient(135deg, #06b6d4, #0ea5e9); }
    .stat-gradient-3 { background: linear-gradient(135deg, #f59e0b, #f97316); }
    .stat-gradient-4 { background: linear-gradient(135deg, #10b981, #34d399); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>

<body class="h-full bg-slate-50">
  <div id="app" class="h-full w-full flex overflow-hidden">
    
    <aside id="sidebar" class="w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col h-full overflow-y-auto">
      <div class="p-5 border-b border-slate-700">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-indigo-500 flex items-center justify-center font-bold text-sm">HR</div>
          <div>
            <div id="sidebar-title" class="font-bold text-sm">HRIS Pro</div>
            <div id="sidebar-company" class="text-xs text-slate-400">PT Perusahaan Anda</div>
          </div>
        </div>
      </div>
      
      <nav class="flex-1 p-3 space-y-1" id="nav-menu">
        <button onclick="navigate('dashboard')" data-nav="dashboard" class="sidebar-item active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-left">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
        </button>
        <button onclick="navigate('employees')" data-nav="employees" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-left">
          <i data-lucide="users" class="w-4 h-4"></i> Database Karyawan
        </button>
        <button onclick="navigate('attendance')" data-nav="attendance" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-left">
          <i data-lucide="clock" class="w-4 h-4"></i> Kehadiran
        </button>
        <button onclick="navigate('payroll')" data-nav="payroll" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-left">
          <i data-lucide="wallet" class="w-4 h-4"></i> Penggajian
        </button>
      </nav>

      <div class="p-3 border-t border-slate-700">
        <div class="flex items-center gap-3 px-3 py-2">
          <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center text-xs font-bold">AD</div>
          <div class="text-sm">
            <div class="font-medium">Admin HR</div>
            <div class="text-xs text-slate-400">Super Admin</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="flex-1 h-full overflow-y-auto" id="main-content">
      <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-10">
        <div>
          <h1 id="page-title" class="text-lg font-bold text-slate-800">Dashboard</h1>
          <p id="page-subtitle" class="text-xs text-slate-500">Selamat datang kembali, Admin</p>
        </div>
        <div class="flex items-center gap-3">
          <div class="relative">
            <input type="text" placeholder="Cari..." class="text-sm border border-slate-200 rounded-lg pl-9 pr-4 py-2 w-56 bg-slate-50">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
          </div>
          <button class="p-2 rounded-lg hover:bg-slate-100"><i data-lucide="bell" class="w-5 h-5 text-slate-600"></i></button>
          <button onclick="openProfileModal()" class="p-2 rounded-lg hover:bg-slate-100"><i data-lucide="user" class="w-5 h-5 text-slate-600"></i></button>
        </div>
      </header>

      <div class="p-6" id="page-container">
        <div id="page-dashboard" class="page fade-in">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="stat-gradient-1 rounded-xl p-5 text-white card-hover">
              <p class="text-xs opacity-80">Total Karyawan</p>
              <p id="stat-total" class="text-2xl font-bold mt-1">0</p>
            </div>
            </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Inisialisasi icon Lucide
    lucide.createIcons();

    // Fungsi Navigasi Dasar
    function navigate(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      const targetPage = document.getElementById('page-' + pageId);
      if(targetPage) targetPage.classList.remove('hidden');
      
      document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
      event.currentTarget.classList.add('active');
    }
  </script>
</body>
</html>
